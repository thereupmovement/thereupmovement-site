<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121212">
<title>Page not found | The ReUp Movement</title>
<link rel="icon" type="image/png" sizes="192x192" href="/hub/reup-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap">
<style>
/* Shown by GitHub Pages for any address on thereupmovement.org that does not exist. Paths start with "/" because
   this page can be served from any folder. Same colors as the community page: black base, red and white accents. */
:root{--bg:#121010;--surface:#1D1918;--ink:#F3EEEB;--muted:#A8A19C;--line:#352F2D;--red:#8E2A2A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45;display:flex;flex-direction:column}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
.top a{display:inline-block}
.top img{height:44px;width:auto;display:block}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:48px 16px 40px}
.code{font-family:"Anton","Impact",sans-serif;font-size:15px;letter-spacing:.14em;color:#F1A39C;margin:0 0 8px}
h1{font-family:"Anton","Impact","Arial Narrow",sans-serif;font-weight:400;font-size:clamp(40px,11vw,72px);line-height:.95;text-transform:uppercase;margin:0 0 14px}
p{margin:0 0 24px;color:var(--muted);max-width:520px}
.go{display:flex;align-items:center;justify-content:center;width:100%;max-width:360px;min-height:56px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:800;font-size:18px;text-decoration:none}
.go:focus-visible,.alt a:focus-visible{outline:3px solid #F1A39C;outline-offset:3px}
.alt{margin:28px 0 0;padding:0;list-style:none;display:grid;gap:10px;max-width:360px}
.alt a{display:flex;align-items:center;min-height:52px;padding:0 18px;border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font-weight:700;text-decoration:none;background:var(--surface)}
.alt a:hover{border-color:var(--ink)}
.band{height:6px;background:var(--red)}
</style>
</head>
<body>
<header class="top"><a href="/" aria-label="The ReUp Movement home page"><img src="/assets/logo-dark.png?v=yu1" alt="The ReUp Movement" width="126" height="44"></a></header>
<main>
  <p class="code">404</p>
  <h1>This page isn't here</h1>
  <p>The link may be old or typed a little wrong. Everything is still on our home page.</p>
  <a class="go" href="/">Go to the home page</a>
  <ul class="alt" aria-label="Or go straight to">
    <li><a href="/#help">I need help for my family</a></li>
    <li><a href="/#volunteer">I want to volunteer</a></li>
    <li><a href="/volunteer/">My volunteer page</a></li>
    <li><a href="/hub/">Team Hub</a></li>
  </ul>
</main>
<div class="band" aria-hidden="true"></div>
</body>
</html>
