<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set your ReUp password</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#121212">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/reup-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F2F2EF;--card:#FFFFFF;--ink:#121212;--muted:#5D5A57;--line:#DADAD5;--brand:#7B2121;--dark:#121212}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;background:var(--dark);border-bottom:4px solid var(--brand);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
header img{height:32px;width:auto;display:block}
main{flex:1;padding:16px;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:60vh}
h1{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:32px;line-height:1.05;text-transform:uppercase}
.lede{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
label.f input{min-height:48px;border-radius:12px;border:1.5px solid var(--line);padding:10px 14px;font-weight:400;background:#fff;color:var(--ink)}
.btn{min-height:48px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-size:15px;font-weight:700;padding:0 16px}
.btn[disabled]{opacity:.55}
.small{font-size:13px;line-height:1.5;color:var(--muted);margin:0}
.toast{position:fixed;left:16px;right:16px;bottom:24px;z-index:6;max-width:528px;margin:0 auto;background:var(--dark);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.4}
</style>
</head>
<body>
<div class="app">
  <header><a href="./" aria-label="The ReUp Movement"><img src="../assets/logo-dark.png?v=yu1" alt="The ReUp Movement" width="91" height="32"></a></header>
  <main id="main"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(function () {
  "use strict";
  var API = "https://script.google.com/macros/s/AKfycbwubNwwouftKblej7oY9kmgoGzgDsNfihm7by44aD3D8slySgZPt4M5x-gCZs8lZ6z-rg/exec";
  function api(fn, args) {
    return fetch(API, { method: "POST", credentials: "omit", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: fn, args: args || [] }) })
      .then(function (r) { if (!r.ok) throw new Error("network"); return r.json(); })
      .then(function (r) { if (r && r.error) throw new Error(r.error); return r ? r.result : null; });
  }
  var $ = function (s) { return document.querySelector(s); };
  var toastT = 0;
  function say(t) { var el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 3600); }

  var q = new URLSearchParams(location.search), email = q.get("e") || "", token = q.get("t") || "", isNew = q.get("new") === "1";
  var main = $("#main");

  if (!email || !token) {
    main.innerHTML = '<h1>Link not right</h1><p class="lede">This link is missing something. Open the one from your email again, or ask Dasia for a new one.</p>' +
      '<p class="small"><a href="./">Back to sign in</a></p>';
    return;
  }

  main.innerHTML = '<h1>' + (isNew ? "Set your password" : "Reset your password") + '</h1>' +
    '<p class="lede">For ' + email.replace(/[<>&]/g, "") + '. At least 8 characters.</p>' +
    '<label class="f">New password<input id="p1" type="password" autocomplete="new-password"></label>' +
    '<label class="f">Type it again<input id="p2" type="password" autocomplete="new-password"></label>' +
    '<button type="button" class="btn" id="go">Save password</button>' +
    '<p class="small"><a href="./">Back to sign in</a></p>';

  $("#go").onclick = function () {
    var p1 = $("#p1").value, p2 = $("#p2").value, b = this;
    if (p1 !== p2) { say("Those two don't match."); return; }
    if (p1.length < 8) { say("Use at least 8 characters."); return; }
    b.disabled = true;
    api("vpAuthSetPassword", [email, token, p1]).then(function (r) {
      b.disabled = false;
      if (!r || !r.ok) { say((r && r.msg) || "That didn't work. Try again."); return; }
      try { localStorage.setItem("reupVolCode", r.code); } catch (e) {}
      main.innerHTML = '<h1>You\'re set</h1><p class="lede">Your password is saved. Taking you to your volunteer page...</p>';
      setTimeout(function () { location.href = "./"; }, 900);
    }, function () { b.disabled = false; say("That didn't go through. Try again in a moment."); });
  };
})();
</script>
</body>
</html>
