<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My ReUp volunteer page</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#121212">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/reup-icon-192.png">
<link rel="apple-touch-icon" href="../hub/reup-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F2F2EF;--card:#FFFFFF;--ink:#121212;--ink2:#3E3B39;--muted:#5D5A57;--line:#DADAD5;--line2:#EEEDE8;--brand:#7B2121;--brand2:#5A1414;--rose:#E8837B;--soft:#F3E3E2;
  --ok:#1E5C38;--okbg:#E3EFE6;--warn:#7A4300;--warnbg:#FBEBCF;--dark:#121212;--dark2:#2E2A28;--darkink:#D9D4D0;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--brand)}
button,input,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--dark);border-bottom:4px solid var(--brand);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
header img{height:32px;width:auto;display:block}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--brand);background:#2A1414;color:#fff;font-weight:700;font-size:14px}
main{flex:1;padding:16px 16px 110px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:32px;line-height:1.05;text-transform:uppercase}
h2{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:24px;text-transform:uppercase}
.hi{margin:0 0 2px;font-size:15px;color:var(--muted)}
.lede{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--muted)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.when{font-size:13px;font-weight:700;color:var(--brand)}
.name{font-size:17px;font-weight:700;margin-top:2px;line-height:1.25}
.sub{font-size:14px;color:var(--ink2);margin-top:2px}
.small{font-size:13px;line-height:1.5;color:var(--muted);margin:0}
.pill{flex:none;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-no{background:var(--soft);color:var(--brand)}
.link{align-self:flex-start;min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--ink);font-size:14px;font-weight:600;text-decoration:underline}
.btn{min-height:48px;border-radius:12px;border:0;background:var(--dark);color:#fff;font-size:15px;font-weight:700;padding:0 16px}
.btn.brand{background:var(--brand)}.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.dash{background:transparent;color:var(--brand);border:1.5px dashed var(--brand);border-radius:14px;min-height:50px}
.btn.on{background:var(--okbg);color:var(--ok);border:1.5px solid var(--ok)}
.btn[disabled]{opacity:.55}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rel{background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.rel h2{font-size:22px}
.rel p,.rel li{font-size:15px;line-height:1.5;margin:0}
.rel ul{margin:0;padding-left:22px;display:grid;gap:8px}
.rel label{display:flex;gap:12px;align-items:flex-start;font-size:15px;font-weight:700;line-height:1.4;min-height:44px}
.rel input{width:24px;height:24px;flex:none;margin-top:1px;accent-color:var(--brand)}
.todo{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.todo .kicker{padding:12px 16px 4px}
.todo button{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 16px;border:0;border-top:1px solid var(--line2);background:#fff;text-align:left;color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:#B7791F;flex:none}
.todo b{display:block;font-size:15px}.todo span.t{flex:1}.todo small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.next{background:var(--dark);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.next .kicker{color:var(--rose)}
.next .count{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--dark2)}
.next .big{font-size:22px;font-weight:700;line-height:1.2}
.next .meta{font-size:15px;color:var(--darkink)}
.next .fine{font-size:13px;line-height:1.45;color:var(--darkink);border-top:1px solid var(--dark2);padding-top:10px;margin:0}
.next a.b1,.next a.b2{min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none}
.next a.b1{background:#fff;color:var(--ink)}.next a.b2{border:1.5px solid #fff;color:#fff}
.next .link{color:var(--darkink);align-self:center}
.ask{background:#2A1414;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ask textarea{border-radius:10px;border:0;padding:8px 10px;font-weight:400}
.ask .yes{min-height:44px;border-radius:10px;border:0;background:var(--rose);color:var(--ink);font-size:14px;font-weight:700}
.ask .keep{min-height:44px;border-radius:10px;border:1.5px solid #fff;background:transparent;color:#fff;font-size:14px;font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
label.f input,label.f textarea{min-height:48px;border-radius:12px;border:1.5px solid var(--line);padding:10px 14px;font-weight:400;background:#fff;color:var(--ink)}
label.f input[readonly]{background:var(--bg);color:var(--muted)}
.choice{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:15px;font-weight:600;text-align:left;padding:0 16px}
.choice[aria-pressed="true"]{border:2px solid var(--brand)}
.bar{display:flex;align-items:center;gap:10px}.bar div{flex:1;height:8px;border-radius:99px;background:#E6E5E0;overflow:hidden}.bar i{display:block;height:8px;background:var(--brand)}
.card.done{flex-direction:row;justify-content:space-between;align-items:center;gap:10px}
.hrs{font-size:18px;font-weight:700;margin-top:6px;text-align:right}
.booked{background:var(--dark);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.booked .kicker{color:var(--rose)}.booked .big{font-size:20px;font-weight:700}.booked p{margin:0;font-size:14px;line-height:1.45;color:var(--darkink)}
.booked a{margin-top:8px;min-height:46px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#fff;color:var(--ink);font-size:14px;font-weight:700;text-decoration:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);padding:4px 6px max(8px,env(safe-area-inset-bottom))}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav button{min-height:58px;border:0;border-top:3px solid transparent;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700}
nav button[aria-current="page"]{color:var(--brand);border-top-color:var(--brand)}
.toast{position:fixed;left:16px;right:16px;bottom:92px;z-index:6;max-width:528px;margin:0 auto;background:var(--dark);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.4}
.center{min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{border:2px solid var(--brand);background:var(--soft);color:var(--brand)}
.merch{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.merch a{flex:none;width:150px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;scroll-snap-align:start}
.merch img{width:150px;height:150px;object-fit:cover;background:#E6E5E0;display:block}
.merch span{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;line-height:1.25}
.merch em{font-style:normal;color:var(--brand)}
.prog{height:8px;border-radius:99px;background:#E6E5E0;overflow:hidden}.prog i{display:block;height:8px;background:var(--ok)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <a href="../" aria-label="The ReUp Movement home page"><img src="../assets/logo-dark.png?v=yu1" alt="The ReUp Movement" width="91" height="32"></a>
    <button type="button" class="avatar" id="me" aria-label="My details" hidden></button>
  </header>
  <main id="main" tabindex="-1"><div class="center"><div class="spin" aria-hidden="true"></div><p class="small" role="status">Opening your volunteer page...</p></div></main>
</div>
<nav id="nav" aria-label="Volunteer page" hidden><div class="in">
  <button type="button" data-tab="home"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button type="button" data-tab="signup"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M12 13v5M9.5 15.5h5"/></svg>Sign up</button>
  <button type="button" data-tab="training"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 9L12 4 2 9l10 5 10-5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>Training</button>
  <button type="button" data-tab="needs"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg>Needs</button>
</div></nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(function () {
  "use strict";
  var API = "https://script.google.com/macros/s/AKfycbwubNwwouftKblej7oY9kmgoGzgDsNfihm7by44aD3D8slySgZPt4M5x-gCZs8lZ6z-rg/exec";
  function api(fn, args) {
    return fetch(API, { method: "POST", credentials: "omit", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: fn, args: args || [] }) })
      .then(function (r) { if (!r.ok) throw new Error("network"); return r.json(); })
      .then(function (r) { if (r && r.error) throw new Error(r.error); return r ? r.result : null; });
  }
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var W = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], M = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var dt = function (iso) { return new Date(iso + "T12:00:00Z"); };
  var short = function (iso) { var d = dt(iso); return W[d.getUTCDay()] + " " + M[d.getUTCMonth()] + " " + d.getUTCDate(); };
  var days = function (iso, today) { return Math.round((dt(iso) - dt(today)) / 864e5); };
  var hrs = function (h) { return (Math.round(h * 100) / 100) + (h === 1 ? " hr" : " hrs"); };

  // The personal link: ?v=code. Saved on this phone so a home screen icon opens it too.
  var code = "";
  try { code = new URLSearchParams(location.search).get("v") || ""; } catch (e) {}
  try { if (code) localStorage.setItem("reupVolCode", code); else code = localStorage.getItem("reupVolCode") || ""; } catch (e) {}
  if (code && location.search) try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}

  var V = null, tab = "home", asking = "", busy = false, toastT = 0, needEdit = {}, refOpen = false;
  function say(t) { var el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 3200); }
  function call(fn, args, msg) {
    if (busy) return; busy = true; document.body.setAttribute("aria-busy", "true");
    [].forEach.call(document.querySelectorAll("main button"), function (b) { b.disabled = true; });
    api(fn, [code].concat(args)).then(function (r) {
      busy = false; document.body.removeAttribute("aria-busy");
      if (!r || !r.ok) return lost();
      V = norm(r); asking = ""; needEdit = {}; refOpen = false; draw(); if (msg) say(typeof msg === "function" ? msg(r) : msg);
    }, function (e) {
      busy = false; document.body.removeAttribute("aria-busy"); draw();
      say(/network|fetch/i.test(String(e && e.message)) ? "No connection. Try again in a moment." : String(e.message || "Something went wrong. Try again."));
    });
  }

  /* A returning volunteer counts as oriented, so their quarterly refresher applies from day one. */
  function norm(r) { if (r && r.refresher && r.orientation && !r.orientation.isNew) r.refresher.needed = true; return r; }
  /* A sign-in or a set-password link both end here: we have a fresh code, so load the page with it. */
  function enter(newCode) {
    code = newCode;
    try { localStorage.setItem("reupVolCode", code); } catch (e) {}
    api("vpGet", [code]).then(function (r) { if (!r || !r.ok) return lost(); V = norm(r); draw(); }, function () {
      $("#main").innerHTML = '<div class="center"><h1>Can\'t reach ReUp right now</h1><p class="lede">Check your connection and try again.</p><button type="button" class="btn brand" onclick="location.reload()">Try again</button></div>';
    });
  }
  function lost() {
    $("#nav").hidden = true; $("#me").hidden = true;
    $("#main").innerHTML = '<div class="center"><h1>Sign in</h1>' +
      '<p class="lede">Use the email and password you set up with ReUp.</p>' +
      '<label class="f">Email<input id="le" type="email" autocomplete="email" inputmode="email"></label>' +
      '<label class="f">Password<input id="lp" type="password" autocomplete="current-password"></label>' +
      '<button type="button" class="btn brand" id="lsin">Sign in</button>' +
      '<p class="small"><a href="#" id="lforgot">Forgot your password, or never set one up?</a></p>' +
      '<p class="small">Still have your old email link? Just open it and you\'re in, same as always.</p>' +
      '<p class="small">Not signed up yet? <a href="../#volunteer">Sign up to volunteer</a>.</p></div>';
    $("#lsin").onclick = function () {
      var em = $("#le").value.trim(), pw = $("#lp").value, b = this;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { say("Add the email you signed up with."); $("#le").focus(); return; }
      if (!pw) { say("Add your password."); $("#lp").focus(); return; }
      b.disabled = true;
      api("vpAuthLogin", [em, pw]).then(function (r) {
        b.disabled = false;
        if (r && r.ok) return enter(r.code);
        say((r && r.msg) || "That didn't work. Try again.");
      }, function () { b.disabled = false; say("That didn't go through. Try again in a moment."); });
    };
    $("#lforgot").onclick = function (e) {
      e.preventDefault();
      var em = ($("#le").value || "").trim(), b = this;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { say("Put your email in the box above first."); $("#le").focus(); return; }
      api("vpAuthResend", [em]).then(function (r) { say((r && r.msg) || "If that email is on our list, a link is on its way."); },
        function () { say("That didn't go through. Try again in a moment."); });
    };
  }

  function calLink(e) {
    var t = String(e.time || ""), m = t.match(/(\d{1,2})(?::(\d{2}))?\s*([AP]M)(?:\s*(?:to|-)\s*(\d{1,2})(?::(\d{2}))?\s*([AP]M))?/i);
    var d = e.date.replace(/-/g, ""), when;
    var hh = function (h, mm, ap) { h = +h % 12 + (/p/i.test(ap) ? 12 : 0); return ("0" + h).slice(-2) + (mm || "00") + "00"; };
    if (m) { var a = hh(m[1], m[2], m[3]), b = m[4] ? hh(m[4], m[5], m[6]) : ("0" + Math.min(23, +a.slice(0, 2) + 3)).slice(-2) + a.slice(2); when = d + "T" + a + "/" + d + "T" + b; }
    else { var n = dt(e.date); n.setUTCDate(n.getUTCDate() + 1); when = d + "/" + n.toISOString().slice(0, 10).replace(/-/g, ""); }
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent("ReUp: " + e.name) + "&dates=" + when +
      "&ctz=America/Chicago&details=" + encodeURIComponent("Volunteering with The ReUp Movement.") + "&location=" + encodeURIComponent(e.address || e.place || "");
  }
  var mapLink = function (e) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(e.address || e.place || e.name); };

  /* Volunteers who signed up before the liability release agree to it here before they add a new date. */
  function relCard() {
    var R = V.release;
    if (!R || R.agreed) return "";
    return '<section class="rel" id="rel" aria-label="' + esc(R.title) + '"><span class="kicker">One quick step</span><h2>' + esc(R.title) + '</h2><p>' + esc(R.intro) + '</p><ul>' +
      R.points.map(function (x) { return "<li>" + esc(x).replace(/\*(.+?)\*/g, "<b>$1</b>") + "</li>"; }).join("") + '</ul>' +
      '<label><input type="checkbox" id="relbox"><span>' + esc(R.agree) + '</span></label>' +
      '<button type="button" class="btn brand" data-rel="1">I agree</button></section>';
  }
  function home() {
    var today = V.today, live = V.mine.filter(function (m) { return !m.cancelled; }), next = live[0], o = V.orientation, h = "";
    h += '<div><p class="hi">Hi, ' + esc(V.first) + '</p><h1>' + (next ? "You're on for " + esc(short(next.date)) : "Ready when you are") + '</h1></div>';
    h += relCard();
    var todos = [];
    if (o.isNew && o.session) todos.push(['Orientation: ' + o.session, 'Booked. Tap to join or move it.', 'training']);
    if (o.isNew && !o.session) todos.push(['Pick your orientation time', 'A 30-minute call before your first event', 'training']);
    if (!live.length) todos.push(['Pick a date to volunteer', 'One tap. We already have your details.', 'signup']);
    var mt = next && (V.meetings || []).filter(function (x) { return x.type === "event" && x.forEvent === next.date && !x.answer; })[0];
    if (mt) todos.push(['RSVP: meeting before ' + mt.forName, mt.label + ', so you know your station', 'training']);
    var rf = V.refresher;
    if (rf && rf.needed && !rf.booked) todos.push(['Book your ' + rf.name.toLowerCase(), 'Due by ' + short(rf.due), 'training']);
    if (todos.length) h += '<section class="todo" aria-label="To do"><div class="kicker">To do</div>' + todos.map(function (t) {
      return '<button type="button" data-go="' + t[2] + '"><span class="dot" aria-hidden="true"></span><span class="t"><b>' + esc(t[0]) + '</b><small>' + esc(t[1]) + '</small></span>' +
        '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5D5A57" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>'; }).join("") + '</section>';
    if (next) {
      var n = days(next.date, today), cd = n <= 0 ? "Today" : n === 1 ? "Tomorrow" : "In " + n + " days";
      var rem = V.remind && V.remind.on ? "A reminder email comes " + (+V.remind.days === 1 ? "the day before" : V.remind.days + " days before") + "." : "";
      h += '<section class="next" aria-label="Next up"><div class="row" style="align-items:center"><span class="kicker">Next up</span><span class="count">' + cd + '</span></div>' +
        '<div><div class="big">' + esc(next.name) + '</div><div class="meta">' + esc(short(next.date)) + (next.time ? ", " + esc(next.time) : "") + '</div>' +

  function hoursRecord() {

        '<span class="pill ' + (rf.booked ? "p-ok" : "p-warn") + '">' + (rf.booked ? "Booked" : "Due " + esc(short(rf.due).slice(4))) + '</span></div>' +
        (refs.length ? refs.map(choice).join("") : '<p class="small">Kyana will post the refresher times here.</p>') +
        (bk && bk.link ? '<a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="' + esc(bk.link) + '" target="_blank" rel="noopener">Join on Google Meet</a>' : "") +

        '<button type="button" class="choice" style="text-align:center" data-rsvp="' + esc(x.id) + '" data-ans="no" aria-pressed="' + (x.answer === "no") + '">Can\'t make it</button></div>' +
